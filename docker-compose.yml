version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-microservice-broker
    restart: unless-stopped
    ports:
      - "5672:5672"    # Cổng AMQP 0-9-1 (Spring Boot kết nối để gửi/nhận tin)
      - "15672:15672"  # Cổng HTTP Management UI (Giao diện Web xem Queue)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: